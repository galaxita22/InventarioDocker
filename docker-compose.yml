
services:
  db:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # 1. Agrega el test de salud para MySQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  llm-server:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Opcional pero recomendado: asignar la GPU si tienes configurado WSL con soporte NVIDIA

  backend:
    build: ./services/backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./services/backend:/app
      - /app/node_modules
    env_file:
      - .env
    # 2. Obliga al backend a esperar el estado "healthy"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run seed && npm run dev"

  frontend:
    build: ./services/frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    depends_on:
      - backend


volumes:
  mysql_data:
  ollama_data:
