services:
  db:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  llm-server:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./services/backend
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./services/backend:/app
      - /app/node_modules
    env_file:
      - .env
    networks:
      - default
      - internal
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: npm start

  db-init:
    build: ./services/backend
    env_file:
      - .env
    environment:
      DB_HOST: db
    restart: "no"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    command: npm run seed

  frontend:
    build: ./services/frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - default
    depends_on:
      - loadbalancer

  loadbalancer:
    image: nginx:alpine
    ports:
      - "3000:3000"
    networks:
      - default
    volumes:
      - ./nginx/load-balancer.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  ollama_data:

networks:
  default:
    driver: bridge
  internal:
    driver: bridge
    internal: true